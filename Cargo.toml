[workspace]
resolver = "3"
members = [
    "crates/steadfast-core",
    "crates/steadfast-storage",
    "crates/steadfast-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
steadfast-core = { path = "crates/steadfast-core" }
steadfast-storage = { path = "crates/steadfast-storage" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rhai = { version = "1", features = ["sync", "serde"] }
thiserror = "2"
dashmap = "6"
crc32fast = "1"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
