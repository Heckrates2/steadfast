# ---------------------------------------------------------------------------
# Steadfast: Anwendungs-Konfiguration
#
# Jede [apps.<app_id>] Sektion definiert eine isolierte REST-API.
# Endpunkte mit auth_required = true verlangen den Header
#   X-API-Key: <api_key_secret der App>
# und erhaelt in der Business-Logik die User-Metadaten aus den Headern
#   X-User-Id / X-User-Role (MVP: Gateway-Pattern, spaeter aus JWT-Claims).
# ---------------------------------------------------------------------------

[apps.todo_app]
# Demo-Direct-Input. Fuer echte Deployments: Secret per Umgebungsvariable
# uebergeben, statt es im Klartext abzulegen (mind. 16 Zeichen):
#   api_key_secret = "${TODO_APP_SECRET}"
#   (Windows: set TODO_APP_SECRET=...  |  Linux: export TODO_APP_SECRET=...)
api_key_secret = "super_geheimes_todo_salt_123"

  # --- CORS -----------------------------------------------------------------
  # Ohne [cors]-Sektion schickt die Engine keine Access-Control-*Header und
  # Browser-Frontends blockieren die Antworten (CORS-Fehler).
  # allowed_origins = exakte Origins (case-insensitive) oder genau ["*"];
  # `*` ist nicht mit allow_credentials kombinierbar (Fail-Fast beim Start).
  # Der Server beantwortet OPTIONS-Preflights selbst (204) und dekoriert
  # echte Antworten mit Allow-Origin; Requests fremder Origins enden mit 403.
  [apps.todo_app.cors]
  allowed_origins = ["http://localhost:3000", "https://todo.example.com"]
  # Optional — Defaults, falls weggelassen:
  #   allowed_methods  = alle unterstuetzten (GET, POST, PUT, PATCH, DELETE)
  #   allowed_headers  = ["content-type", "x-api-key", "x-user-id", "x-user-role"]
  #   exposed_headers  = ["location"] (Response-Header, die Browser-JS lesen darf)
  #   allow_credentials = false
  #   max_age_secs     = kein Access-Control-Max-Age-Header
  # allowed_methods = ["GET", "POST"]
  # allowed_headers = ["content-type", "x-api-key"]
  # exposed_headers = ["location", "x-request-id"]
  # allow_credentials = true
  # max_age_secs = 600

  [apps.todo_app.endpoints.tasks_get]
  path = "/tasks"
  method = "GET"
  auth_required = false
  paging_default = 20

  [apps.todo_app.endpoints.tasks_create]
  path = "/tasks"
  method = "POST"
  auth_required = true

  business_logic = """
  fn on_request(payload, user) {
      if user.role != "premium" && payload.is_priority == true {
          throw "Nur Premium-Nutzer koennen Prioritaets-Tasks erstellen!";
      }
      if payload.title.len() == 0 {
          throw "Titel darf nicht leer sein.";
      }
      payload.created_by = user.id;
      payload.status = "offen";
      return payload;
  }
  """

  # --- Schema-Validierung (optional, nur POST/PUT/PATCH) --------------------
  # Wird beim Start vorkompiliert und VOR dem Skript geprueft: fehlende
  # Pflichtfelder oder Typverstoesse kommen als 400 mit
  # `error.code = "validation_failed"` zurueck, bevor Daten entstehen.
  #   required             — Pflichtfelder (bei PATCH ohne Pflicht-Check)
  #   allow_unknown_fields — false (Default) = strikt, undeklarierte Felder abweisen
  #   types                — Typ pro Feld: "string" | "number" | "boolean" |
  #                          "object" | "array" | "null" |
  #                          "date" (YYYY-MM-DD, inkl. Schaltjahre) |
  #                          "datetime" (RFC 3339, Offset/Z ist Pflicht)
  # Hinweis: der Schema-Block steht bewusst NACH business_logic — alles nach
  # einer [section] gehoert dieser Sektion.
  [apps.todo_app.endpoints.tasks_create.schema]
  required = ["title"]
  allow_unknown_fields = true

    [apps.todo_app.endpoints.tasks_create.schema.types]
    title = "string"
    is_priority = "boolean"

  # --- Demo-Erweiterung: vollstaendiges CRUD ueber dieselbe Kollektion ---

  [apps.todo_app.endpoints.tasks_replace]
  path = "/tasks"
  method = "PUT"
  auth_required = true

  [apps.todo_app.endpoints.tasks_patch]
  path = "/tasks"
  method = "PATCH"
  auth_required = true

  [apps.todo_app.endpoints.tasks_delete]
  path = "/tasks"
  method = "DELETE"
  auth_required = true
